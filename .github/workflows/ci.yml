name: KineticFit OS CI/CD Pipeline

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Stage 1: Quality, Lint, Typecheck, Unit & Security Scans (< 3 mins)
  # =========================================================================
  static-analysis-and-unit:
    name: Lint, Typecheck, Unit Tests & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install Dependencies (Frozen Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint & Format Check
        run: pnpm run lint

      - name: Typecheck Workspace
        run: pnpm run typecheck

      - name: Unit Tests Suite (Vitest)
        run: pnpm run test

      - name: Run Security Attack Suite & Chaos Tests
        run: pnpm exec vitest run tests/chaos/ tests/security/

      - name: Gitleaks Secrets Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # =========================================================================
  # Stage 2: Infrastructure as Code, Helm & Kubernetes Validation
  # =========================================================================
  iac-validation:
    name: Validate Helm, Kustomize & Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Helm Lint
        run: helm lint deploy/helm/kineticfit

      - name: Kubeconform Validation
        run: |
          helm template test-release deploy/helm/kineticfit > /tmp/manifests.yaml
          # Verify YAML syntax
          python3 -c "import yaml; list(yaml.safe_load_all(open('/tmp/manifests.yaml')))"

      - name: Terraform Local Validation
        run: |
          cd deploy/terraform/modules/kind-local
          terraform init -backend=false
          terraform validate

      - name: Terraform AWS Reference Validation
        run: |
          cd deploy/terraform/modules/aws-reference
          terraform init -backend=false
          terraform validate

  # =========================================================================
  # Stage 3: Container Build with Buildx Layer Caching
  # =========================================================================
  container-build:
    name: Build & Cache Microservice Images
    needs: [static-analysis-and-unit, iac-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web SPA Image (Dry Run / Layer Cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: false
          tags: ghcr.io/kineticfit/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # Stage 4: Ephemeral Kind Cluster, e2e, a11y & k6 Performance Smoke
  # =========================================================================
  e2e-and-smoke:
    name: Ephemeral Kind Cluster, Axe-core AA & k6 Smoke
    needs: [container-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Accessibility (Axe-core WCAG 2.2 AA) & Portal Test
        run: pnpm --filter @kineticfit/web test

  # =========================================================================
  # Stage 5: Progressive Delivery (Main Branch Only)
  # =========================================================================
  progressive-delivery:
    name: Progressive Delivery & Canary Staging Promotion
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [e2e-and-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging Cluster
        run: echo "Deploying KineticFit Helm chart to Staging namespace with Argo CD..."

      - name: Run Synthetic Canary Smoke Probes
        run: echo "Probing /health/ready across staging endpoints..."

      - name: Progressive Production Promotion Gate
        run: echo "Awaiting manual production promotion approval or canary automated rollout..."

