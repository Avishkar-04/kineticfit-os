apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: billing-service-rollout
  namespace: kineticfit
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: kineticfit-os
spec:
  replicas: 2
  strategy:
    blueGreen:
      activeService: billing-service
      previewService: billing-service-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
      prePromotionAnalysis:
        templates:
          - templateName: kineticfit-success-rate-p99
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/part-of: kineticfit-os
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: billing-service
          image: ghcr.io/kineticfit/billing-service:v1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: kineticfit-config
            - secretRef:
                name: kineticfit-secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service-preview
  namespace: kineticfit
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3006
      targetPort: 3000
  selector:
    app.kubernetes.io/name: billing-service
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: web-rollout
  namespace: kineticfit
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: kineticfit-os
spec:
  replicas: 2
  strategy:
    blueGreen:
      activeService: web
      previewService: web-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: kineticfit-os
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: web
          image: ghcr.io/kineticfit/web:v1.0.0
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: web-preview
  namespace: kineticfit
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app.kubernetes.io/name: web
