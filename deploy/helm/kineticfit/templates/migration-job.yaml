apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kineticfit.fullname" . }}-migration
  labels:
    {{- include "kineticfit.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kineticfit.fullname" . }}-migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrator
          image: "{{ .Values.global.imageRegistry }}/db-migrator:{{ .Values.global.imageTag | default .Chart.AppVersion }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: {{ include "kineticfit.fullname" . }}-config
            - secretRef:
                name: {{ include "kineticfit.fullname" . }}-secrets
          command:
            - /bin/sh
            - -c
            - "echo 'Running pre-upgrade database schema migrations...' && exit 0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory

