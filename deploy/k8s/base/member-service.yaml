apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-service
  namespace: kineticfit
  labels:
    app.kubernetes.io/name: member-service
    app.kubernetes.io/part-of: kineticfit-os
    app.kubernetes.io/component: microservice
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: member-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: member-service
        app.kubernetes.io/part-of: kineticfit-os
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: member-service
          image: ghcr.io/kineticfit/member-service:v1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kineticfit-config
            - secretRef:
                name: kineticfit-secrets
          env:
            - name: SERVICE_NAME
              value: "member-service"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: member-service
  namespace: kineticfit
  labels:
    app.kubernetes.io/name: member-service
    app.kubernetes.io/part-of: kineticfit-os
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3002
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: member-service

