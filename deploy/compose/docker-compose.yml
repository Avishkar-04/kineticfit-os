version: '3.9'

networks:
  kf_network:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  rabbit_data:
  minio_data:
  grafana_data:

services:
  # =========================================================================
  # CORE PROFILE: Relational Data, Cache, Message Broker, Object Store & Edge
  # =========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: kf_postgres
    profiles: ["core", "full", "ha", "chaos"]
    environment:
      POSTGRES_USER: kinetic_admin
      POSTGRES_PASSWORD: kinetic_secret
      POSTGRES_DB: kineticfit
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetic_admin -d kineticfit"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kf_network

  pgbouncer:
    image: edoburu/pgbouncer:v1.22.0
    container_name: kf_pgbouncer
    profiles: ["core", "full", "ha", "chaos"]
    environment:
      DB_USER: kinetic_app
      DB_PASSWORD: kinetic_secret
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: kineticfit
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kf_network

  redis:
    image: redis:7-alpine
    container_name: kf_redis
    profiles: ["core", "full", "ha", "chaos"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - kf_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: kf_rabbitmq
    profiles: ["core", "full", "ha", "chaos"]
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - kf_network

  minio:
    image: minio/minio:RELEASE.2024-02-26T09-33-48Z
    container_name: kf_minio
    profiles: ["core", "full", "ha", "chaos"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kf_network

  kong:
    image: kong:3.7-alpine
    container_name: kf_kong
    profiles: ["core", "full", "ha", "chaos"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    volumes:
      - ../kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - kf_network

  nginx:
    image: nginx:alpine
    container_name: kf_nginx
    profiles: ["core", "full", "ha", "chaos"]
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - kong
    networks:
      - kf_network

  # =========================================================================
  # FULL PROFILE: Observability & Support (Prometheus, Grafana, Alertmanager,
  # Loki, Tempo, OTel Collector, Unleash Feature Flags, Mailhog)
  # =========================================================================

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: kf_prometheus
    profiles: ["full"]
    volumes:
      - ../../observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../../observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    networks:
      - kf_network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: kf_alertmanager
    profiles: ["full"]
    volumes:
      - ../../observability/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - kf_network

  grafana:
    image: grafana/grafana:10.3.3
    container_name: kf_grafana
    profiles: ["full"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - kf_network

  loki:
    image: grafana/loki:2.9.4
    container_name: kf_loki
    profiles: ["full"]
    ports:
      - "3100:3100"
    networks:
      - kf_network

  tempo:
    image: grafana/tempo:2.4.0
    container_name: kf_tempo
    profiles: ["full"]
    ports:
      - "3200:3200"
      - "4317:4317"
    networks:
      - kf_network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: kf_otel_collector
    profiles: ["full"]
    ports:
      - "4318:4318"
    networks:
      - kf_network

  unleash:
    image: unleashorg/unleash-server:5.8.0
    container_name: kf_unleash
    profiles: ["full"]
    environment:
      DATABASE_URL: postgres://kinetic_admin:kinetic_secret@postgres:5432/kineticfit
      DATABASE_SSL: "false"
      INIT_CLIENT_API_TOKENS: "*:default.client-secret-token-2026"
    ports:
      - "4242:4242"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kf_network

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: kf_mailhog
    profiles: ["full"]
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - kf_network

  # =========================================================================
  # HA PROFILE: PostgreSQL Streaming Read Replica & Shard 2
  # =========================================================================

  postgres-replica:
    image: postgres:16-alpine
    container_name: kf_postgres_replica
    profiles: ["ha"]
    environment:
      POSTGRES_USER: kinetic_admin
      POSTGRES_PASSWORD: kinetic_secret
      POSTGRES_DB: kineticfit
    ports:
      - "5433:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kf_network

  postgres-shard2:
    image: postgres:16-alpine
    container_name: kf_postgres_shard2
    profiles: ["ha"]
    environment:
      POSTGRES_USER: kinetic_admin
      POSTGRES_PASSWORD: kinetic_secret
      POSTGRES_DB: kineticfit_shard2
    ports:
      - "5434:5432"
    networks:
      - kf_network

  # =========================================================================
  # CHAOS PROFILE: Network Fault Injection Proxy (Toxiproxy)
  # =========================================================================

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.7.0
    container_name: kf_toxiproxy
    profiles: ["chaos"]
    ports:
      - "8474:8474"
    networks:
      - kf_network
